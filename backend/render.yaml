services:
  - type: web
    name: iqac-portal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        value: mongodb://localhost:27017
      - key: DB_NAME
        value: iqac
      - key: JWT_SECRET
        value: dev-secret-change-me
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads
